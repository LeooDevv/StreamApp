<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-BR">
<head>
  <meta charset="UTF-8"/>
  <title>Detalhe - StreamApp</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"/>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"/>
  <style>
    body { background: #0d0d1a; color: #eee; }
    .card { background: #161625; border: 1px solid #2a2a40; }
    .card-header { background: #e50914 !important; }
    .estrelas { color: #f5c518; }
    .breadcrumb-item a { color: #e50914; }
    label { color: #999; }
  </style>
</head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>
<div class="container mt-4" style="max-width:750px;">

  <nav aria-label="breadcrumb">
    <ol class="breadcrumb">
      <li class="breadcrumb-item"><a th:href="@{/dashboard}">Dashboard</a></li>
      <li class="breadcrumb-item"><a th:href="@{/midias}">Catalogo</a></li>
      <li class="breadcrumb-item active text-light" th:text="${midia.titulo}"></li>
    </ol>
  </nav>

  <div class="card shadow mb-4">
    <div class="card-header text-white d-flex justify-content-between align-items-center">
      <h5 class="mb-0">
        <i th:class="${'bi ' + midia.icone + ' me-2'}"></i>
        <span th:text="${midia.titulo}"></span>
      </h5>
      <div>
        <a th:href="@{/midias/{id}/editar(id=${midia.id})}" class="btn btn-sm btn-warning me-1">
          <i class="bi bi-pencil"></i> Editar
        </a>
        <form th:action="@{/midias/{id}/deletar(id=${midia.id})}" method="post" class="d-inline"
              onsubmit="return confirm('Confirmar exclusao?')">
          <button class="btn btn-sm btn-dark" type="submit"><i class="bi bi-trash"></i></button>
        </form>
      </div>
    </div>
    <div class="card-body">
      <div class="row g-3">
        <div class="col-md-3">
          <label class="small">Tipo</label>
          <div>
            <span class="badge"
              th:classappend="${midia.tipoMidia == 'FILME'} ? 'bg-danger' :
                              (${midia.tipoMidia == 'SERIE'} ? 'bg-primary' :
                              (${midia.tipoMidia == 'PODCAST'} ? 'bg-success' : 'bg-warning text-dark'))"
              th:text="${midia.tipoMidia}"></span>
          </div>
        </div>
        <div class="col-md-3">
          <label class="small">Ano</label>
          <div class="fw-semibold" th:text="${midia.anoLancamento}"></div>
        </div>
        <div class="col-md-3">
          <label class="small">Genero</label>
          <div class="fw-semibold" th:text="${midia.genero}"></div>
        </div>
        <div class="col-md-3">
          <label class="small">Avaliacao</label>
          <div class="estrelas fw-semibold">
            <i class="bi bi-star-fill"></i> <span th:text="${midia.avaliacao}"></span>/5
          </div>
        </div>
        <div class="col-12">
          <label class="small">Descricao</label>
          <div th:text="${midia.descricao}"></div>
        </div>
        <div class="col-12">
          <label class="small">Informacoes Especificas</label>
          <div class="fw-semibold" th:text="${midia.infoEspecifica}"></div>
        </div>
      </div>
    </div>
  </div>

  <a th:href="@{/midias}" class="btn btn-outline-secondary">
    <i class="bi bi-arrow-left me-1"></i>Voltar ao Catalogo
  </a>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
