<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-BR">
<head>
  <meta charset="UTF-8"/>
  <title>Dashboard - StreamApp</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"/>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"/>
  <style>
    body { background: #0d0d1a; color: #eee; }
    .stat-card { background: #161625; border: 1px solid #2a2a40; border-radius: 12px; }
    .stat-card:hover { border-color: #e50914; }
    .rec-card { background: #161625; border: 1px solid #2a2a40; transition: transform .2s; }
    .rec-card:hover { transform: translateY(-3px); border-color: #e50914; }
    .estrelas { color: #f5c518; }
    .btn-criterio.active { background: #e50914; border-color: #e50914; color: white; }
    .btn-criterio { border-color: #2a2a40; color: #aaa; }
    .btn-criterio:hover { border-color: #e50914; color: #eee; }
  </style>
</head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>
<div class="container mt-4">

  <div class="d-flex justify-content-between align-items-center mb-4">
    <h3><i class="bi bi-speedometer2 me-2 text-danger"></i>Dashboard</h3>
    <a th:href="@{/midias/nova}" class="btn btn-danger"><i class="bi bi-plus-lg me-1"></i>Adicionar Midia</a>
  </div>

  <!-- Estatisticas -->
  <div class="row g-3 mb-4">
    <div class="col-6 col-md-2">
      <div class="stat-card p-3 text-center">
        <div class="fs-2 fw-bold text-white" th:text="${total}">0</div>
        <div class="text-muted small">Total</div>
      </div>
    </div>
    <div class="col-6 col-md-2">
      <div class="stat-card p-3 text-center">
        <div class="fs-2 fw-bold text-danger" th:text="${filmes}">0</div>
        <div class="text-muted small"><i class="bi bi-film me-1"></i>Filmes</div>
      </div>
    </div>
    <div class="col-6 col-md-2">
      <div class="stat-card p-3 text-center">
        <div class="fs-2 fw-bold text-primary" th:text="${series}">0</div>
        <div class="text-muted small"><i class="bi bi-display me-1"></i>Series</div>
      </div>
    </div>
    <div class="col-6 col-md-2">
      <div class="stat-card p-3 text-center">
        <div class="fs-2 fw-bold text-success" th:text="${podcasts}">0</div>
        <div class="text-muted small"><i class="bi bi-mic me-1"></i>Podcasts</div>
      </div>
    </div>
    <div class="col-6 col-md-2">
      <div class="stat-card p-3 text-center">
        <div class="fs-2 fw-bold text-warning" th:text="${lives}">0</div>
        <div class="text-muted small"><i class="bi bi-broadcast me-1"></i>Lives</div>
      </div>
    </div>
    <div class="col-6 col-md-2">
      <div class="stat-card p-3 text-center">
        <div class="fs-2 fw-bold text-info" th:text="${mediaAvaliacao}">0</div>
        <div class="estrelas small"><i class="bi bi-star-fill"></i> Media</div>
      </div>
    </div>
  </div>

  <!-- Recomendacoes (Strategy Pattern) -->
  <div class="mb-3 d-flex align-items-center gap-2 flex-wrap">
    <span class="text-muted me-2">Recomendacoes por:</span>
    <a th:href="@{/dashboard(criterio='TOP_AVALIADOS')}"
       th:classappend="${criterio == 'TOP_AVALIADOS'} ? ' active'"
       class="btn btn-sm btn-criterio">
      <i class="bi bi-star-fill me-1"></i>Top Avaliados
    </a>
    <a th:href="@{/dashboard(criterio='MAIS_RECENTES')}"
       th:classappend="${criterio == 'MAIS_RECENTES'} ? ' active'"
       class="btn btn-sm btn-criterio">
      <i class="bi bi-clock me-1"></i>Mais Recentes
    </a>
    <a th:href="@{/dashboard(criterio='GENERO_POPULAR')}"
       th:classappend="${criterio == 'GENERO_POPULAR'} ? ' active'"
       class="btn btn-sm btn-criterio">
      <i class="bi bi-fire me-1"></i>Genero Popular
    </a>
  </div>

  <div class="row g-3">
    <div class="col-12 text-center text-muted py-4" th:if="${recomendacoes.isEmpty()}">
      <i class="bi bi-inbox fs-2 d-block"></i>Nenhuma midia cadastrada.
    </div>
    <div class="col-md-4 col-lg-2" th:each="m : ${recomendacoes}">
      <div class="rec-card h-100 rounded p-3">
        <div class="d-flex justify-content-between mb-1">
          <span class="badge badge-sm"
            th:classappend="${m.tipoMidia == 'FILME'} ? 'bg-danger' :
                            (${m.tipoMidia == 'SERIE'} ? 'bg-primary' :
                            (${m.tipoMidia == 'PODCAST'} ? 'bg-success' : 'bg-warning text-dark'))"
            th:text="${m.tipoMidia}" style="font-size:.65rem"></span>
          <small class="text-muted" th:text="${m.anoLancamento}" style="font-size:.7rem"></small>
        </div>
        <div class="fw-semibold small mb-1" th:text="${m.titulo}"></div>
        <div class="estrelas" style="font-size:.75rem">
          <i class="bi bi-star-fill"></i> <span th:text="${m.avaliacao}"></span>
        </div>
        <a th:href="@{/midias/{id}(id=${m.id})}" class="btn btn-sm btn-outline-light w-100 mt-2" style="font-size:.75rem">
          Ver mais
        </a>
      </div>
    </div>
  </div>

</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
