<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-BR">
<head>
  <meta charset="UTF-8"/>
  <title>Catalogo - StreamApp</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"/>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"/>
  <style>
    body { background: #0d0d1a; color: #eee; }
    .card-midia { background: #161625; border: 1px solid #2a2a40; transition: transform .2s; }
    .card-midia:hover { transform: translateY(-4px); border-color: #e50914; }
    .badge-tipo { font-size: .7rem; }
    .estrelas { color: #f5c518; }
    .form-control, .form-select { background: #161625; border-color: #2a2a40; color: #eee; }
    .form-control:focus, .form-select:focus { background: #1e1e35; border-color: #e50914; color: #eee; box-shadow: none; }
    .breadcrumb-item a { color: #e50914; }
    .table { color: #eee; }
    .table-hover tbody tr:hover { background: #1e1e35; }
  </style>
</head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>
<div class="container mt-4">

  <nav aria-label="breadcrumb">
    <ol class="breadcrumb">
      <li class="breadcrumb-item"><a th:href="@{/dashboard}">Dashboard</a></li>
      <li class="breadcrumb-item active text-light">Catalogo</li>
    </ol>
  </nav>

  <div th:if="${mensagemSucesso}" class="alert alert-success alert-dismissible fade show">
    <i class="bi bi-check-circle-fill me-2"></i><span th:text="${mensagemSucesso}"></span>
    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
  </div>

  <div class="d-flex justify-content-between align-items-center mb-3">
    <h3><i class="bi bi-collection-play me-2 text-danger"></i>Catalogo de Midias</h3>
    <a th:href="@{/midias/nova}" class="btn btn-danger"><i class="bi bi-plus-lg me-1"></i>Adicionar</a>
  </div>

  <form th:action="@{/midias}" method="get" class="mb-4">
    <div class="input-group">
      <input type="text" name="busca" th:value="${busca}" class="form-control"
             placeholder="Buscar por titulo ou genero..."/>
      <button class="btn btn-outline-danger" type="submit"><i class="bi bi-search"></i> Buscar</button>
      <a th:href="@{/midias}" class="btn btn-outline-secondary" th:if="${busca != null and !busca.isEmpty()}">
        <i class="bi bi-x"></i>
      </a>
    </div>
  </form>

  <!-- Cards de midia -->
  <div class="row g-3">
    <div class="col-12 text-center text-muted py-5" th:if="${midias.isEmpty()}">
      <i class="bi bi-inbox fs-1 d-block mb-2"></i>Nenhuma midia encontrada.
    </div>
    <div class="col-md-4 col-lg-3" th:each="m : ${midias}">
      <div class="card card-midia h-100">
        <div class="card-body">
          <div class="d-flex justify-content-between align-items-start mb-2">
            <span class="badge"
              th:classappend="${m.tipoMidia == 'FILME'} ? 'bg-danger' :
                              (${m.tipoMidia == 'SERIE'} ? 'bg-primary' :
                              (${m.tipoMidia == 'PODCAST'} ? 'bg-success' : 'bg-warning text-dark'))"
              th:text="${m.tipoMidia}"></span>
            <small class="text-muted" th:text="${m.anoLancamento}"></small>
          </div>
          <h6 class="card-title" th:text="${m.titulo}"></h6>
          <p class="text-muted small mb-1" th:text="${m.genero}"></p>
          <div class="estrelas mb-2">
            <i class="bi bi-star-fill"></i>
            <small th:text="${m.avaliacao}"></small>/5
          </div>
          <p class="small text-muted" style="font-size:.8rem; overflow:hidden; max-height:3rem"
             th:text="${m.descricao}"></p>
        </div>
        <div class="card-footer bg-transparent border-0 d-flex gap-1">
          <a th:href="@{/midias/{id}(id=${m.id})}" class="btn btn-sm btn-outline-light flex-fill">
            <i class="bi bi-eye"></i>
          </a>
          <a th:href="@{/midias/{id}/editar(id=${m.id})}" class="btn btn-sm btn-outline-warning flex-fill">
            <i class="bi bi-pencil"></i>
          </a>
          <form th:action="@{/midias/{id}/deletar(id=${m.id})}" method="post" class="flex-fill"
                onsubmit="return confirm('Confirmar exclusao?')">
            <button class="btn btn-sm btn-outline-danger w-100" type="submit">
              <i class="bi bi-trash"></i>
            </button>
          </form>
        </div>
      </div>
    </div>
  </div>

  <div class="mt-3 text-muted small">Total: <strong th:text="${midias.size()}"></strong> midia(s)</div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
